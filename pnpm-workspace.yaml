packages:
  - 'src/packages/*'
  - 'src/packages/confing/*'
  - 'src/packages/shared/*'
  - 'src/packages/ui-react/*'

  - 'src/projects/mzhvv'
  - 'src/projects/experience'
  - 'src/projects/stack/angular-22'
  - 'src/projects/stack/react-19'
  - 'src/projects/stack/vue-3'

allowBuilds:
  # Нативный файловый watcher на C++; ускоряет HMR и watch-режим в Vite/Webpack.
  '@parcel/watcher': true
  # Сборщик и бандлер; postinstall-скрипт скачивает нативный бинарник Go.
  esbuild: true
  # Встраиваемая key-value БД (C++); используется в Gatsby, Parcel и некоторых инструментах сборки.
  lmdb: true
  # Нативное расширение msgpack для ускоренной сериализации; опциональное, но заметно быстрее JS-реализации.
  msgpackr-extract: true
  # Mock Service Worker; postinstall-скрипт копирует service-worker в public/, при отключении файл копируется вручную через `npx msw init`.
  msw: false
  # Нативная библиотека обработки изображений (libvips); нужна для оптимизации картинок в Next.js.
  sharp: true
  # Нативный резолвер модулей; используется в eslint-import-resolver и некоторых плагинах Vite.
  unrs-resolver: true
