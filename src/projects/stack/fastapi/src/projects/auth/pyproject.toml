# src/projects/stack/fastapi/src/projects/auth/pyproject.toml

[project]
name = "stack-fastapi-auth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["hatchling"]
