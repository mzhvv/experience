# src/projects/mzhvv/docker-compose.dev.yml

# Изолирует dev-контейнер и image от production-окружения.
name: mzhvv-dev

services:
  web:
    build:
      # Контекст — корень монорепозитория с workspace-пакетами и lock-файлом.
      context: ../../..
      dockerfile: src/projects/mzhvv/Dockerfile.dev
    ports:
      # Dev-сервер с hot reload доступен на localhost:3000.
      - "3000:3000"
    develop:
      watch:
        # Синхронизируем код приложения; node_modules и .next остаются в контейнере.
        - action: sync
          path: .
          target: /repo/src/projects/mzhvv
          ignore:
            - .next/
            - node_modules/
            - package.json

        # Синхронизируем исходники workspace-пакетов, кроме зависимостей и манифестов.
        - action: sync
          path: ../../packages
          target: /repo/src/packages
          ignore:
            - "**/node_modules/"
            - "**/.next/"
            - "**/package.json"

        # Пересобираем image при изменении зависимостей приложения.
        - action: rebuild
          path: package.json

        # Пересобираем image при изменении манифеста любого workspace-пакета.
        - action: rebuild
          path: ../../packages
          include:
            - "**/package.json"

        # Пересобираем image и устанавливаем зависимости при изменении workspace-конфигурации.
        - action: rebuild
          path: ../../../package.json
        - action: rebuild
          path: ../../../pnpm-lock.yaml
        - action: rebuild
          path: ../../../pnpm-workspace.yaml
        - action: rebuild
          path: ../../../.npmrc
