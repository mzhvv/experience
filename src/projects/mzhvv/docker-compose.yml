# src/projects/mzhvv/docker-compose.yml

# Изолирует production-контейнер и image от dev-окружения.
name: mzhvv-prod

services:
  web:
    build:
      # Корень монорепозитория нужен Dockerfile для доступа к workspace-пакетам.
      context: ../../..
      dockerfile: src/projects/mzhvv/Dockerfile
    ports:
      # Production доступен на localhost:3000.
      - '3000:3000'
    environment:
      STACK_HOST_URL: ${STACK_HOST_URL:-http://host.docker.internal:3001}
    # Поднимает production-контейнер после перезапуска Docker.
    restart: unless-stopped
